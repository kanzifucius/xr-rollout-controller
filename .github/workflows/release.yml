# Publishes the controller image to GHCR.
# Pushes to main tag the image with the short SHA and latest.
# A tag push must match vMAJOR.MINOR.PATCH with an optional pre-release
# and optional build metadata. hack/release-tag.sh classifies it:
#   stable (v1.2.3, v1.2.3+sha): image tag is the git tag only; GitHub
#     Release with generated notes; Helm chart version without the leading v.
#   pre-release (v1.2.3-rc.1, v1.2.3-alpha.1, optional +build): image tag is
#     the git tag only (not latest); GitHub Release is a prerelease
#     (--prerelease, --latest=false) with the same notes and assets; Helm
#     chart version is the tag without v and is not retagged onto a stable
#     version or latest.
# The same tag's GitHub Release also attaches the xr-rollout CLI binaries.
# There is no separate CLI tag. Pre-release tags stay prerelease and are
# not marked Latest. Docs for the same tag are published by docs.yml, not this file.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release tag classification
        run: bash hack/release-tag_test.sh

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          # shellcheck source=hack/release-tag.sh
          source hack/release-tag.sh
          image="${RELEASE_IMAGE_REPOSITORY}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            classify_release_tag "${GITHUB_REF_NAME}"
            # Git tag only. The function refuses to add latest.
            tags="$(release_image_tag_list "${image}")"
            echo "Image tag ${tags} (kind ${RELEASE_KIND})"
          else
            short="${GITHUB_SHA:0:7}"
            tags="${image}:${short}"$'\n'"${image}:latest"
            echo "Image tags ${short} and latest"
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance attestations need extra token permissions. The image
          # push uses GITHUB_TOKEN with packages:write only.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}

  release:
    name: Publish GitHub Release and Helm chart
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Generate release manifests
        run: |
          image="${{ needs.image.outputs.image }}:${GITHUB_REF_NAME}"
          make build-installer IMG="${image}"
          cp config/crd/bases/rollouts.platform.example.org_compositionrollouts.yaml dist/compositionrollouts.crd.yaml
          grep -F "${image}" dist/install.yaml
          test -s dist/compositionrollouts.crd.yaml

      - name: Build xr-rollout binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" out="$3"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w" -o "dist/${out}" ./cmd/xr-rollout
          }
          build linux amd64 xr-rollout-linux-amd64
          build linux arm64 xr-rollout-linux-arm64
          build darwin amd64 xr-rollout-darwin-amd64
          build darwin arm64 xr-rollout-darwin-arm64
          build windows amd64 xr-rollout-windows-amd64.exe
          test -s dist/xr-rollout-linux-amd64
          test -s dist/xr-rollout-linux-arm64
          test -s dist/xr-rollout-darwin-amd64
          test -s dist/xr-rollout-darwin-arm64
          test -s dist/xr-rollout-windows-amd64.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=hack/release-tag.sh
          source hack/release-tag.sh
          classify_release_tag "${GITHUB_REF_NAME}"
          release_github_create_flags
          release_github_edit_flags
          echo "GitHub Release ${GITHUB_REF_NAME} kind ${RELEASE_KIND}"
          assets=(
            dist/install.yaml
            dist/compositionrollouts.crd.yaml
            dist/xr-rollout-linux-amd64
            dist/xr-rollout-linux-arm64
            dist/xr-rollout-darwin-amd64
            dist/xr-rollout-darwin-arm64
            dist/xr-rollout-windows-amd64.exe
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            if ((${#GITHUB_EDIT_FLAGS[@]} > 0)); then
              gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${GITHUB_EDIT_FLAGS[@]}"
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${GITHUB_CREATE_FLAGS[@]}"
          fi

      - name: Lint and package Helm chart
        run: |
          set -euo pipefail
          # shellcheck source=hack/release-tag.sh
          source hack/release-tag.sh
          classify_release_tag "${GITHUB_REF_NAME}"
          version="$(release_chart_version)"
          echo "Packaging chart ${version} (kind ${RELEASE_KIND}) appVersion ${GITHUB_REF_NAME}"
          helm lint charts/xr-rollout-controller
          helm template xr-rollout-controller charts/xr-rollout-controller --include-crds >/dev/null
          helm package charts/xr-rollout-controller \
            --version "${version}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination dist
          chart="dist/xr-rollout-controller-${version}.tgz"
          test -s "${chart}"
          helm template xr-rollout-controller "${chart}" --include-crds \
            | grep -F "ghcr.io/kanzifucius/xr-rollout-controller:${GITHUB_REF_NAME}"

      - name: Push Helm chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=hack/release-tag.sh
          source hack/release-tag.sh
          classify_release_tag "${GITHUB_REF_NAME}"
          version="$(release_chart_version)"
          chart="dist/xr-rollout-controller-${version}.tgz"
          # This version only. Do not copy the OCI tag onto a stable version or latest.
          echo "Pushing chart version ${version} only"
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          set +e
          push_log="$(helm push "${chart}" oci://ghcr.io/kanzifucius/charts 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${push_log}"
          if [[ "${status}" -ne 0 ]]; then
            if printf '%s\n' "${push_log}" | grep -qiE 'already exists|cannot reuse|digest already'; then
              echo "Chart version ${version} is already present on GHCR; leaving it in place."
            else
              exit "${status}"
            fi
          fi

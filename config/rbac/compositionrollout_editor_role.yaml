# This rule is not used by the project xr-rollout-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the rollouts.platform.example.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: xr-rollout-controller
    app.kubernetes.io/managed-by: kustomize
  name: compositionrollout-editor-role
rules:
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts/status
  verbs:
  - get

# Bind both ClusterRoles to the user named in the spoke kubeconfig.
# The User name xr-rollout-hub must match that kubeconfig user.
# A team split uses config/rbac/hub_spoke_team_role.yaml instead of the
# aggregate binding below. Keep this aggregate role for one user that
# may patch every XR type.
# Do not bind these to a ServiceAccount on the spoke.
# This user does not get CompositionRollout. That object lives on the hub.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xr-rollout-hub
rules:
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositions", "compositionrevisions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xr-rollout-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xr-rollout-hub
subjects:
  - kind: User
    name: xr-rollout-hub
    apiGroup: rbac.authorization.k8s.io
---
# aggregationRule is a top-level ClusterRole field. Do not nest it under metadata.
# Label one ClusterRole per XR API group with
# rollouts.platform.example.org/aggregate-to-rollout-controller: "true"
# The controller only server-side applies spec.crossplane.compositionRevisionRef.name
# on Manual XRs. Kubernetes RBAC cannot limit the patch to that field.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xr-rollout-hub-xr-access
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rollouts.platform.example.org/aggregate-to-rollout-controller: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xr-rollout-hub-xr-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xr-rollout-hub-xr-access
subjects:
  - kind: User
    name: xr-rollout-hub
    apiGroup: rbac.authorization.k8s.io

# This rule is not used by the project xr-rollout-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over rollouts.platform.example.org.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: xr-rollout-controller
    app.kubernetes.io/managed-by: kustomize
  name: compositionrollout-admin-role
rules:
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts
  verbs:
  - '*'
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts/status
  verbs:
  - get

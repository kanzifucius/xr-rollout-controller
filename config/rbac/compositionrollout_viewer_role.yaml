# This rule is not used by the project xr-rollout-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to rollouts.platform.example.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: xr-rollout-controller
    app.kubernetes.io/managed-by: kustomize
  name: compositionrollout-viewer-role
rules:
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts/status
  verbs:
  - get

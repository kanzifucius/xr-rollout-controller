# Aggregated ClusterRole bound to the controller ServiceAccount by
# xr_aggregate_role_binding.yaml (same subject as manager-rolebinding, so
# kustomize deploy and the e2e install grant it together). Label additional
# per-XR-group ClusterRoles with
# rollouts.platform.example.org/aggregate-to-rollout-controller=true so the
# controller can get/list/watch/patch those XR types without wildcards.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xr-rollout-controller-xr-access
  labels:
    app.kubernetes.io/name: xr-rollout-controller
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rollouts.platform.example.org/aggregate-to-rollout-controller: "true"
rules: []
---

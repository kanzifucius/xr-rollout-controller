---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apiextensions.crossplane.io
  resources:
  - compositionrevisions
  - compositions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts/finalizers
  verbs:
  - update
- apiGroups:
  - rollouts.platform.example.org
  resources:
  - compositionrollouts/status
  verbs:
  - get
  - patch
  - update

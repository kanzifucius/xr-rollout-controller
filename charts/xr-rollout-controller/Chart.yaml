apiVersion: v2
name: xr-rollout-controller
description: Rolls out Crossplane CompositionRevision upgrades to composite resources.
type: application
# Development chart version. The release workflow repackages with --version
# taken from the git tag (the leading v is stripped).
version: 0.1.0

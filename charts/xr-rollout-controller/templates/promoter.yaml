{{- if .Values.promoter.enabled }}
{{- if lt (len .Values.promoter.clusters) 2 }}
{{- fail "promoter.clusters must name at least two clusters" }}
{{- end }}
{{/*
Kubeconfig Secrets are not created by this chart. Create one per cluster.
The Secret name is the cluster name.

apiVersion: v1
kind: Secret
metadata:
  name: dev
  namespace: {{ .Release.Namespace }}
  labels:
    sigs.k8s.io/multicluster-runtime-kubeconfig: "true"
type: Opaque
data:
  kubeconfig: <base64 kubeconfig>

Repeat for test, acc, and prod.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "xr-rollout-controller.fullname" . }}-promoter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xr-rollout-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "xr-rollout-controller.fullname" . }}-promoter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xr-rollout-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "xr-rollout-controller.fullname" . }}-promoter
subjects:
  - kind: ServiceAccount
    name: {{ include "xr-rollout-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rollouts.platform.example.org/v1alpha1
kind: PromotionPipeline
metadata:
  name: environments
  labels:
    {{- include "xr-rollout-controller.labels" . | nindent 4 }}
spec:
  clusters:
    {{- range .Values.promoter.clusters }}
    - name: {{ . | quote }}
    {{- end }}
{{- end }}
